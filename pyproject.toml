[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-merchandise-discovery"
version = "0.1.0"
description = "Modular MVP for autonomous merchandise niche discovery and artwork generation."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "openai>=1,<2",
    "pydantic>=2,<3",
    "pymongo>=4,<5",
    "python-dotenv>=1,<2",
    "streamlit>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

# Streamlit Cloud detects this file and uses Poetry when resolving dependencies. The application
# follows a src-layout, so Poetry needs the package location declared explicitly even though the
# local editable install is configured through setuptools above.
[tool.poetry]
packages = [
    { include = "merchandise_discovery", from = "src" },
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.isort]
known-first-party = ["merchandise_discovery"]
